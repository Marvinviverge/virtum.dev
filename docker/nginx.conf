# Site statique de virtum.dev. Le HTTPS, le certificat et les en-têtes de sécurité communs sont portés par le
# nginx de l'hôte (dépôt vps-infra), qui renvoie vers ce conteneur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Adresses sans .html (cleanUrls de VitePress) : /docs/installation → docs/installation.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fichiers à empreinte dans leur nom : jamais modifiés, mis en cache un an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La documentation n'a pas de page d'index : on arrive sur l'installation
    location ~ ^/(en/)?docs/?$ {
        return 301 /$1docs/installation;
    }

    error_page 404 /404.html;
}
